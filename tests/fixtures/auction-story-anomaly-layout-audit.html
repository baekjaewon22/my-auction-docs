<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../src/react-app/index.css" />
  <title>입찰 스토리 관리자 페이지 반응형 감사</title>
</head>
<body>
  <main class="page auction-story-anomaly-page">
    <div class="page-header auction-story-anomaly-header">
      <div><a class="auction-story-back">← 캘린더</a><h2>입찰 스토리 관리자 페이지</h2><p>입찰 일정은 있으나 임장 또는 브리핑자료 제출이 누락된 사건만 표시합니다.</p></div>
      <div class="auction-story-controls"><label>달력 <input type="month" value="2026-08" /></label><button>새로고침</button></div>
    </div>
    <div class="auction-story-branch-tabs"><button class="active">전체 지사</button><button>의정부본사</button><button>서초지사</button><button>대전지사</button><button>부산지사</button></div>
    <div class="auction-story-summary"><div><span>관리 대상</span><strong>14</strong></div><div><span>임장 누락</span><strong>10</strong></div><div><span>브리핑자료 누락</span><strong>13</strong></div></div>
    <div class="auction-story-list" id="story-list"></div>
  </main>
  <script>
    const list = document.querySelector('#story-list');
    const branches = [['의정부본사','uijeongbu'],['서초지사','seocho'],['대전지사','daejeon'],['부산지사','busan']];
    for (let index = 0; index < 12; index += 1) {
      const [branch, branchClass] = branches[index % branches.length];
      const card = document.createElement('article');
      card.className = 'auction-story-card';
      card.innerHTML = `<header><div><span class="auction-story-branch ${branchClass}">${branch}</span><strong>아주긴담당자이름테스트</strong><small>컨설턴트</small></div><time>2026-08-26</time></header><div class="auction-story-case"><div><span>물건</span><strong>상업·업무시설과매우긴카테고리</strong></div><div><span>고객명</span><strong>반응형테스트고객</strong></div><div><span>법원</span><strong>의정부지방법원 고양지원 관련법원과지원한줄표시</strong></div><div><span>사건번호</span><strong>2026타경123456789 · 물건번호 123</strong></div></div><div class="auction-story-stages"><div class="auction-story-stage complete"><span>✓</span><span>임장</span><small>2026-08-20</small></div><div class="auction-story-stage missing"><span>×</span><span>브리핑자료 제출</span><small>누락</small></div><div class="auction-story-stage complete"><span>✓</span><span>입찰</span><small>2026-08-26</small></div></div><footer><span>누락 항목</span><strong>브리핑자료 제출</strong></footer>`;
      list.appendChild(card);
    }
  </script>
</body>
</html>
