<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/logo2.png" />
		<link rel="apple-touch-icon" href="/logo2.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#174ea6" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My-Auction Office</title>
		<meta property="og:title" content="My-Auction Office" />
		<meta property="og:description" content="문서 관리 및 협업 시스템" />
		<meta property="og:image" content="/logo2.png" />
		<meta property="og:type" content="website" />
		<meta name="description" content="마이옥션 오피스 - 문서 관리 및 협업 시스템" />
	</head>

	<body>
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					var theme = saved === 'dark' || saved === 'light'
						? saved
						: (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
					document.documentElement.dataset.theme = theme;
					document.documentElement.style.colorScheme = theme;
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f172a' : '#174ea6');
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		<div id="root"></div>
		<script type="module" src="/src/react-app/main.tsx"></script>
	</body>
</html>
